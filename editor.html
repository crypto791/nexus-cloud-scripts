<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Cloud Scripts</title><style>
:root{color-scheme:dark;--bg:#0b0911;--panel:#171121;--card:#21192e;--border:#3d2b53;--accent:#ad80ff;--text:#f2eaff;--muted:#a99ab9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#251338,var(--bg) 45%);color:var(--text);font:14px system-ui,Arial}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:#7948cf;color:white;font-weight:700}button:hover{filter:brightness(1.15)}button.secondary{background:#342444}button.danger{background:#812c51}input,textarea,select{width:100%;border:1px solid var(--border);border-radius:10px;padding:12px;background:#100d18;color:var(--text)}textarea{min-height:260px;font:13px/1.6 ui-monospace,monospace;resize:vertical}label{display:block;color:var(--muted);margin:13px 0 6px}.hidden{display:none!important}#auth{max-width:420px;margin:9vh auto;padding:30px;background:var(--panel);border:1px solid var(--border);border-radius:22px;box-shadow:0 20px 80px #0007}.logo{font-weight:900;letter-spacing:1px;color:#c4a5ff;font-size:23px}.sub{color:var(--muted)}.layout{display:flex;min-height:100vh}.side{width:225px;background:#100c19;border-right:1px solid var(--border);padding:24px 15px;flex-shrink:0}.side button{width:100%;text-align:left;margin-top:9px;background:transparent;color:#cbb9df}.side button.active,.side button:hover{background:#352249;color:white}.main{flex:1;min-width:0;padding:28px;max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;margin:12px 0}.stat{font-size:28px;font-weight:900;color:#c9aaff}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.row input{flex:1}.item{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px;margin:10px 0}.pill{display:inline-block;border:1px solid #70528f;border-radius:50px;padding:4px 9px;color:#d3b6ff;font-size:12px}.warn{padding:12px;border:1px solid #8c6933;border-radius:10px;color:#f3c47c;background:#38281355;margin:12px 0}#toast{position:fixed;bottom:15px;right:15px;background:#352347;border:1px solid #77529d;border-radius:12px;padding:13px;max-width:90%;display:none;z-index:5}pre{white-space:pre-wrap;word-break:break-all;background:#0c0913;padding:13px;border-radius:10px}h1{font-size:24px}h2{font-size:18px}@media(max-width:680px){.layout{display:block}.side{width:auto;border-right:0;border-bottom:1px solid var(--border);padding:13px}.nav{display:flex;overflow-x:auto;gap:5px}.side button{width:auto;white-space:nowrap}.main{padding:16px}.top{align-items:start}.top h1{font-size:20px}}
</style></head><body><div id="auth" class="hidden"><div class="logo">☁ NEXUS CLOUD</div><h1 id="authTitle">Entrar na sua conta</h1><p class="sub">Gerencie e publique seus scripts Luau.</p><form id="authForm"><label>Usuário</label><input id="username" minlength="3" maxlength="32" pattern="[a-zA-Z0-9_]+" required autocomplete="username"><label>Senha</label><input id="password" type="password" minlength="8" required autocomplete="current-password"><p><button id="authBtn" type="submit">Login</button> <button type="button" class="secondary" onclick="toggleAuth()" id="toggleBtn">Criar conta</button></p></form></div>
<div id="app" class="layout hidden"><aside class="side"><div class="logo">☁ NEXUS CLOUD</div><p class="sub">SCRIPTS PLATFORM</p><div class="nav"><button data-tab="dashboard" onclick="tab('dashboard')">◈ Dashboard</button><button data-tab="publish" onclick="tab('publish')">＋ Publish</button><button data-tab="scripts" onclick="tab('scripts')">⌘ My Scripts</button><button data-tab="community" onclick="tab('community')">◎ Community</button><button data-tab="tickets" onclick="tab('tickets')">◇ Tickets</button></div></aside><main class="main"><div class="top"><div><p class="sub">NEXUS CLOUD / <span id="crumb">DASHBOARD</span></p><h1 id="heading">Dashboard</h1></div><div class="row"><span id="who" class="pill"></span><button class="secondary" onclick="logout()">Sair</button></div></div><div id="content"></div></main></div><div id="toast"></div>
<script>
const $=id=>document.getElementById(id),escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let registering=false,my=[],selected='',current='dashboard';const base=location.origin;
function notify(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',4500)}async function api(path,opts={}){let r=await fetch(path,{credentials:'same-origin',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Erro HTTP '+r.status);return d}function json(method,data){return{method,body:JSON.stringify(data)}}function toggleAuth() {registering=!registering;$('authTitle').textContent=registering?'Criar conta':'Entrar na sua conta';$('authBtn').textContent=registering?'Cadastrar':'Login';$('toggleBtn').textContent=registering?'Já tenho conta':'Criar conta'}$('authForm').onsubmit=async e=>{e.preventDefault();try{let c={username:$('username').value,password:$('password').value};if(registering)await api('/api/register',json('POST',c));await api('/api/login',json('POST',c));history.replaceState(null,'','/editor');await init()}catch(err){notify(err.message)}};async function init(){try{let me=await api('/api/me');$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='@'+me.username;await load();tab('dashboard')}catch{$('app').classList.add('hidden');$('auth').classList.remove('hidden')}}async function logout(){await api('/api/logout',{method:'POST'});location.href='/login'}async function load(){my=await api('/api/panels')}
function tab(name){current=name;$('crumb').textContent=name.toUpperCase();$('heading').textContent=({dashboard:'Dashboard',publish:'Publicar script',scripts:'Meus scripts',community:'Comunidade',tickets:'Gerenciar tickets'})[name];document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));Promise.resolve(({dashboard,publish,scripts,community,tickets})[name]()).catch(e=>notify(e.message))}
function dashboard(){let views=my.reduce((a,x)=>a+x.views,0),exec=my.reduce((a,x)=>a+x.executions,0);$('content').innerHTML=`<div class="grid"><div class="card"><div class="sub">Scripts</div><div class="stat">${my.length}</div></div><div class="card"><div class="sub">Visualizações RAW</div><div class="stat">${views}</div></div><div class="card"><div class="sub">Execuções</div><div class="stat">${exec}</div></div></div><div class="card"><h2>Bem-vindo ao Nexus Cloud</h2><p class="sub">Publique scripts, gerencie visibilidade e gere tickets temporários para o cliente executor.</p><button onclick="tab('publish')">＋ Novo script</button></div>`}
function formHTML(p={}){return `<form id="scriptForm" class="card"><label>Nome</label><input id="sName" maxlength="80" required value="${escapeHTML(p.name||'')}"><label>Descrição</label><input id="sDesc" maxlength="1000" value="${escapeHTML(p.description||'')}"><label>Visibilidade</label><select id="sVisibility"><option value="private" ${p.visibility!=='public'?'selected':''}>🔒 Privado — somente via ticket do executor</option><option value="public" ${p.visibility==='public'?'selected':''}>🌐 Público — aparece na comunidade e possui RAW</option></select><label>Código Luau</label><textarea id="sCode" spellcheck="false" placeholder="-- Seu código aqui"></textarea><div class="row"><button type="submit">${p.id?'Salvar alterações':'Publicar e gerar ID'}</button>${p.id?'<button type="button" class="secondary" onclick="tab(\'scripts\')">Voltar</button>':''}</div><p class="sub">Alterar um script revoga seus tickets anteriores.</p></form>`}
function publish(p={}){$('content').innerHTML=formHTML(p);$('sCode').value=p.script||'';$('scriptForm').onsubmit=async e=>{e.preventDefault();let d={name:$('sName').value,description:$('sDesc').value,visibility:$('sVisibility').value,script:$('sCode').value};try{let r=await api(p.id?'/api/panels/'+encodeURIComponent(p.id):'/api/panels',json(p.id?'PUT':'POST',d));await load();notify('Salvo! ID: '+(p.id||r.id));tab('scripts')}catch(err){notify(err.message)}}}
function itemHTML(p,publicItem=false){return `<div class="item"><div class="row"><strong>${escapeHTML(p.name)}</strong><span class="pill">${escapeHTML(p.visibility)}</span></div><p class="sub">${escapeHTML(p.description||'Sem descrição')}</p><p class="sub">ID: <code>${escapeHTML(p.id)}</code> · ${p.views} views · ${p.executions} execuções ${publicItem?'· @'+escapeHTML(p.author):''}</p><div class="row">${p.visibility==='public'?`<button class="secondary" onclick="window.open('/raw/${encodeURIComponent(p.id)}','_blank')">View RAW</button>`:''}${publicItem?'':`<button onclick="editScript('${p.id}')">Editar</button><button class="secondary" onclick="selectTicket('${p.id}')">Tickets</button><button class="danger" onclick="removeScript('${p.id}')">Excluir</button>`}</div></div>`}
function scripts(){$('content').innerHTML='<div class="row"><button onclick="tab(\'publish\')">＋ Publicar</button><button class="secondary" onclick="refreshScripts()">Atualizar</button></div>'+(my.length?my.map(p=>itemHTML(p)).join(''):'<div class="card">Nenhum script publicado ainda.</div>')}
async function refreshScripts(){await load();scripts()}async function editScript(id){try{let p=await api('/api/panels/'+encodeURIComponent(id));tab('publish');publish(p)}catch(e){notify(e.message)}}async function removeScript(id){if(!confirm('Excluir definitivamente este script e todos os tickets?'))return;try{await api('/api/panels/'+encodeURIComponent(id),{method:'DELETE'});await refreshScripts();notify('Script excluído')}catch(e){notify(e.message)}}
async function community(){ $('content').innerHTML='<div class="row"><input id="search" placeholder="Buscar scripts públicos"><button onclick="searchCommunity()">Pesquisar</button></div><div id="results"></div>';await searchCommunity()}async function searchCommunity(){try{let q=$('search')?.value||'',items=await api('/api/community?q='+encodeURIComponent(q));$('results').innerHTML=items.length?items.map(x=>itemHTML(x,true)).join(''):'<div class="card">Nenhum script público encontrado.</div>'}catch(e){notify(e.message)}}
function selectTicket(id){selected=id;tab('tickets')}async function tickets(){if(!my.length){$('content').innerHTML='<div class="card">Publique um script primeiro.</div>';return}if(!my.some(x=>x.id===selected))selected=my[0].id;$('content').innerHTML=`<div class="card"><label>Seu script</label><select id="ticketPanel" onchange="selected=this.value;ticketHistory()">${my.map(p=>`<option value="${escapeHTML(p.id)}" ${p.id===selected?'selected':''}>${escapeHTML(p.name)} (${escapeHTML(p.id)})</option>`).join('')}</select><label>Validade do ticket</label><select id="duration"><option value="30">30 segundos</option><option value="60" selected>1 minuto</option><option value="300">5 minutos</option><option value="600">10 minutos</option><option value="1800">30 minutos</option><option value="3600">1 hora</option></select><div class="warn">⚠ Quanto mais tempo aberto, mais desprotegido ele fica. Tickets são de uso único e expiram automaticamente.</div><div class="row"><button onclick="generateTicket()">Gerar ticket</button><button class="danger" onclick="revokeTickets()">Revogar todos</button></div><div id="generated"></div></div><div class="card"><h2>Histórico de tickets</h2><div id="history"></div></div>`;await ticketHistory()}
async function generateTicket(){try{let r=await api('/api/panels/'+encodeURIComponent(selected)+'/tickets',json('POST',{seconds:Number($('duration').value)}));$('generated').innerHTML='<p>Ticket gerado. Copie agora: ele não será exibido novamente.</p><pre id="ticketText"></pre><button class="secondary" onclick="navigator.clipboard.writeText($(\'ticketText\').textContent).then(()=>notify(\'Copiado!\'))">Copiar ticket</button>';$('ticketText').textContent=r.panel_id+'|'+r.ticket;await ticketHistory()}catch(e){notify(e.message)}}async function ticketHistory(){try{let rows=await api('/api/panels/'+encodeURIComponent(selected)+'/tickets');$('history').innerHTML=rows.length?rows.map(t=>`<div class="item"><code>${escapeHTML(t.id)}…</code><p class="sub">Expira: ${new Date(t.expires_at).toLocaleString('pt-BR')} · ${t.used_at?'Utilizado':new Date(t.expires_at)<new Date()?'Expirado':'Ativo'}</p></div>`).join(''):'Nenhum ticket'}catch(e){notify(e.message)}}async function revokeTickets(){if(!confirm('Revogar todos os tickets deste script?'))return;try{await api('/api/panels/'+encodeURIComponent(selected)+'/tickets',{method:'DELETE'});await ticketHistory();notify('Tickets revogados')}catch(e){notify(e.message)}}init();
</script></body></html>
